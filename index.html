<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi Remas</title>
    
    <!-- TAG WAJIB UNTUK APLIKASI PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- Tema warna disesuaikan dengan gradasi baru -->
    <meta name="theme-color" content="#4e54c8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Font Poppins untuk tampilan yang lebih modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      body { 
        /* Background Gradasi Modern (Biru ke Ungu) */
        background: linear-gradient(135deg, #8f94fb 0%, #4e54c8 100%);
        background-attachment: fixed; /* Latar tetap saat scroll */
        padding: 20px; 
        font-family: 'Poppins', sans-serif; 
        padding-bottom: 80px; 
        min-height: 100vh;
      }

      .portal-container { 
        max-width: 600px; 
        margin: auto; 
      }
      
      /* Header Section (Lebih bersih & elegan) */
      .header-section { 
        text-align: center; 
        margin-bottom: 40px; 
        margin-top: 20px;
        color: white; /* Teks putih agar kontras dengan background */
      }
      .header-logo { 
        width: 110px; 
        height: auto; /* Mempertahankan proporsi asli */
        /* Hapus border-radius: 50% agar tidak melingkar */
        border-radius: 12px; /* Diberi sudut tumpul sedikit (opsional, ganti 0 jika ingin kotak siku) */
        box-shadow: 0 8px 15px rgba(0,0,0,0.2); 
        margin-bottom: 20px; 
        background-color: white; /* Jika logo transparan, terlihat bagus dengan background putih */
        padding: 5px; /* Memberi jarak antara logo dan tepi border */
      }
      .header-title { 
        font-weight: 700; 
        margin-bottom: 8px; 
        text-shadow: 1px 1px 3px rgba(0,0,0,0.3); /* Bayangan teks agar terbaca jelas */
      }
      .header-desc { 
        font-size: 0.95em; 
        padding: 0 10px; 
        opacity: 0.9;
        font-weight: 400;
      }
      
      /* Card Aplikasi - Tampilan Glassmorphism (Kaca) atau Putih Bersih */
      .app-card { 
        background: rgba(255, 255, 255, 0.95); /* Putih dengan sedikit transparansi */
        padding: 16px 20px; 
        border-radius: 16px; 
        box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
        margin-bottom: 18px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        cursor: pointer; 
        transition: all 0.3s ease; /* Transisi lebih halus */
        border-left: 5px solid #4e54c8; /* Aksen garis warna di sisi kiri */
      }
      .app-card:hover { 
        transform: translateY(-4px); 
        box-shadow: 0 15px 25px rgba(0,0,0,0.15); 
        background: white;
      }
      .app-title { 
        font-weight: 600; 
        font-size: 1.1em; 
        margin: 0; 
        color: #2c3e50; 
        pointer-events: none; 
      }
      .btn-container { 
        display: flex; 
        gap: 10px; 
      }
      
      /* Tombol di dalam Card */
      .btn-buka {
        background-color: #4e54c8;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 0.85em;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .btn-buka:hover { background-color: #3b409c; color: white;}
      
      .btn-bagikan {
        background-color: #f1f3f5;
        color: #495057;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 0.85em;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .btn-bagikan:hover { background-color: #e9ecef; }

      /* Loader / Indikator Loading */
      .loading-text {
        color: white;
        text-align: center;
        font-weight: 500;
        margin-top: 30px;
      }

      /* TOMBOL MENGAMBANG INSTALL APLIKASI */
      #btn-install {
          position: fixed; 
          bottom: 30px; 
          right: 30px;
          background: linear-gradient(45deg, #11998e, #38ef7d); /* Gradasi hijau mencolok */
          color: white; 
          border: none;
          padding: 14px 24px; 
          border-radius: 50px; 
          font-size: 15px; 
          font-weight: 600;
          box-shadow: 0 8px 20px rgba(17,153,142,0.4); 
          cursor: pointer; 
          z-index: 1000;
          display: none; 
          align-items: center; 
          gap: 10px;
          transition: transform 0.3s, box-shadow 0.3s;
      }
      #btn-install:hover { 
          transform: scale(1.05);
          box-shadow: 0 10px 25px rgba(17,153,142,0.5); 
      }
    </style>
</head>
<body>

    <!-- Menambahkan Elemen Vektor/Bentuk (Aksen) Latar Belakang -->
    <!-- Elemen SVG absolut ini akan diletakkan di belakang konten untuk memberi kesan dinamis -->
    <svg style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
      <path fill="rgba(255,255,255,0.05)" fill-opacity="1" d="M0,160L48,144C96,128,192,96,288,117.3C384,139,480,213,576,213.3C672,213,768,139,864,122.7C960,107,1056,149,1152,154.7C1248,160,1344,128,1392,112L1440,96L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path>
    </svg>
    <svg style="position:fixed; bottom:0; right:0; width:100%; height:100%; z-index:-1; pointer-events:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
      <path fill="rgba(255,255,255,0.05)" fill-opacity="1" d="M0,64L60,101.3C120,139,240,213,360,213.3C480,213,600,139,720,112C840,85,960,107,1080,128C1200,149,1320,171,1380,181.3L1440,192L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
    </svg>

    <div class="portal-container">
      <div class="header-section">
        <!-- Logo tidak lagi dilingkari, bentuk asli dengan sedikit radius (sudut) -->
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEja1Fx6AIsRxcFt8KrYHPM1aXrSosPlXrjRXUfv_s-k7t-IsaM1Ygob2Hpl2h34uBxsNx-mJoloMcJhPR43SrxNaI0ertfFY_vt131zhqMpGBWLDwsxYqPLt2eriRiIIx9_lvmzGMR_2DCPdTJis9BYPjyBvPttV2sG80aEjWfKuqdtkA/s220/favicon.jpg" alt="Logo Remas" class="header-logo">
        <h3 class="header-title">Portal Aplikasi</h3>
        <p class="header-desc">Portal Aplikasi Remaja Masjid Wakaf Haqqul Yaqin Dinoyo</p>
      </div>
      
      <div id="app-list">
        <div class="loading-text">
          <div class="spinner-border spinner-border-sm me-2" role="status"></div>
          Memuat data aplikasi...
        </div>
      </div>
    </div>

    <!-- TOMBOL MENGAMBANG INSTALL PWA -->
    <button id="btn-install">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
      Install Portal
    </button>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmKENBlOfArK77UX1EihKWCgM9JymjV6Klf4VLCt3RyChCCUWTeNBEgJvyiuIlc4C_/exec';

        // ==========================================
        // AMBIL DATA DARI SPREADSHEET (APPS SCRIPT)
        // ==========================================
        async function fetchApps() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const apps = await response.json();
                renderApps(apps);
            } catch (error) {
                document.getElementById('app-list').innerHTML = '<div class="text-center text-white mt-4"><strong>Gagal memuat data.</strong><br>Periksa koneksi Anda.</div>';
            }
        }

        function renderApps(apps) {
            const container = document.getElementById('app-list');
            container.innerHTML = ''; 
            
            if(apps.length === 0) {
                container.innerHTML = '<div class="text-center text-white mt-4">Belum ada data aplikasi.</div>';
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => window.location.href = app.url;
                
                const title = document.createElement('p');
                title.className = 'app-title';
                title.textContent = app.name;
                
                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-container';
                
                const openBtn = document.createElement('button');
                openBtn.className = 'btn-buka';
                openBtn.textContent = 'Buka';
                
                const shareBtn = document.createElement('button');
                shareBtn.className = 'btn-bagikan';
                shareBtn.innerHTML = 'Bagikan';
                shareBtn.onclick = (e) => { 
                    e.stopPropagation(); // Mencegah ter-klik URL buka
                    shareApp(app.name, app.url); 
                };
                
                btnGroup.appendChild(openBtn);
                btnGroup.appendChild(shareBtn);
                card.appendChild(title);
                card.appendChild(btnGroup);
                container.appendChild(card);
            });
        }

        function shareApp(name, url) {
            if (navigator.share) {
                navigator.share({ title: name, text: 'Silakan buka aplikasi ' + name + ' melalui tautan berikut:', url: url }).catch(console.error);
            } else {
                navigator.clipboard.writeText('Aplikasi ' + name + ': ' + url);
                alert('Tautan aplikasi ' + name + ' telah disalin ke clipboard!');
            }
        }

        fetchApps();

        // ==========================================
        // FITUR REGISTRASI PWA (SERVICE WORKER & INSTALL)
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker gagal:', err));
            });
        }

        let deferredPrompt;
        const btnInstall = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.style.display = 'flex'; 
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstall.style.display = 'none'; 
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
