<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi Remas</title>
    
    <!-- TAG WAJIB UNTUK APLIKASI PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #f4f6f9; padding: 20px; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
      .portal-container { max-width: 600px; margin: auto; }
      .header-section { text-align: center; margin-bottom: 30px; }
      .header-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
      .header-title { font-weight: 700; color: #2c3e50; margin-bottom: 5px; }
      .header-desc { color: #6c757d; font-size: 0.95em; padding: 0 10px; }
      
      .app-card { background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.2s; }
      .app-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
      .app-title { font-weight: 600; font-size: 1.1em; margin: 0; color: #333; pointer-events: none; }
      .btn-container { display: flex; gap: 8px; }

      /* TOMBOL MENGAMBANG INSTALL APLIKASI */
      #btn-install {
          position: fixed; bottom: 25px; right: 25px;
          background-color: #0d6efd; color: white; border: none;
          padding: 12px 20px; border-radius: 50px; font-size: 15px; font-weight: bold;
          box-shadow: 0 4px 10px rgba(13,110,253,0.4); cursor: pointer; z-index: 1000;
          display: none; /* Disembunyikan sampai event beforeinstallprompt terpicu */
          align-items: center; gap: 8px;
      }
      #btn-install:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>

    <div class="portal-container">
      <div class="header-section">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEja1Fx6AIsRxcFt8KrYHPM1aXrSosPlXrjRXUfv_s-k7t-IsaM1Ygob2Hpl2h34uBxsNx-mJoloMcJhPR43SrxNaI0ertfFY_vt131zhqMpGBWLDwsxYqPLt2eriRiIIx9_lvmzGMR_2DCPdTJis9BYPjyBvPttV2sG80aEjWfKuqdtkA/s220/favicon.jpg" alt="Logo Remas" class="header-logo">
        <h3 class="header-title">Portal Aplikasi</h3>
        <p class="header-desc">Portal Aplikasi Remaja Masjid Wakaf Haqqul Yaqin Dinoyo</p>
      </div>
      
      <div id="app-list">
        <div class="text-center text-muted">Memuat data aplikasi...</div>
      </div>
    </div>

    <!-- TOMBOL MENGAMBANG INSTALL PWA -->
    <button id="btn-install">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
      Install Portal
    </button>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYvq1gR79MqFE8c7mAzPVLzzZyqQAd3YKzvWvIh61DNcpd0BF1iy-tOBoBqgUMj7-J/exec';

        // ==========================================
        // AMBIL DATA DARI SPREADSHEET (APPS SCRIPT)
        // ==========================================
        async function fetchApps() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const apps = await response.json();
                renderApps(apps);
            } catch (error) {
                document.getElementById('app-list').innerHTML = '<div class="text-center text-danger">Gagal memuat data. Periksa koneksi Anda.</div>';
            }
        }

        function renderApps(apps) {
            const container = document.getElementById('app-list');
            container.innerHTML = ''; 
            
            if(apps.length === 0) {
                container.innerHTML = '<div class="text-center text-muted">Belum ada data aplikasi.</div>';
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => window.location.href = app.url;
                
                const title = document.createElement('p');
                title.className = 'app-title';
                title.textContent = app.name;
                
                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-container';
                
                const openBtn = document.createElement('button');
                openBtn.className = 'btn btn-primary btn-sm';
                openBtn.textContent = 'Buka';
                
                const shareBtn = document.createElement('button');
                shareBtn.className = 'btn btn-outline-secondary btn-sm';
                shareBtn.innerHTML = 'Bagikan';
                shareBtn.onclick = (e) => { 
                    e.stopPropagation(); 
                    shareApp(app.name, app.url); 
                };
                
                btnGroup.appendChild(openBtn);
                btnGroup.appendChild(shareBtn);
                card.appendChild(title);
                card.appendChild(btnGroup);
                container.appendChild(card);
            });
        }

        function shareApp(name, url) {
            if (navigator.share) {
                navigator.share({ title: name, text: 'Silakan buka ' + name + ':', url: url }).catch(console.error);
            } else {
                navigator.clipboard.writeText('Aplikasi ' + name + ': ' + url);
                alert('Link telah disalin!');
            }
        }

        // Panggil data saat halaman dimuat
        fetchApps();

        // ==========================================
        // FITUR REGISTRASI PWA (SERVICE WORKER & INSTALL)
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker terdaftar!', reg);
                }).catch(err => {
                    console.log('Service Worker gagal:', err);
                });
            });
        }

        let deferredPrompt;
        const btnInstall = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.style.display = 'flex'; // Tampilkan tombol
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstall.style.display = 'none'; 
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
